<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35543F"/>
      <stop offset="100%" stop-color="#213D2B"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#182A20"/>
      <stop offset="100%" stop-color="#223A2C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3C567"/>
      <stop offset="55%" stop-color="#C7A233"/>
      <stop offset="100%" stop-color="#9C7A1E"/>
    </linearGradient>
  </defs>

  <!-- cover -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#cover)"/>

  <!-- spine binding -->
  <path d="M16 116 a100 100 0 0 1 100 -100 h -30 a100 100 0 0 0 -100 100 v280 a100 100 0 0 0 100 100 h30 a100 100 0 0 1 -100 -100 z" fill="url(#spine)"/>
  <g fill="#C7A233" opacity="0.55">
    <rect x="34" y="128" width="26" height="7" rx="3.5"/>
    <rect x="34" y="188" width="26" height="7" rx="3.5"/>
    <rect x="34" y="248" width="26" height="7" rx="3.5"/>
    <rect x="34" y="308" width="26" height="7" rx="3.5"/>
    <rect x="34" y="368" width="26" height="7" rx="3.5"/>
  </g>

  <!-- monogram L, built as a ledger column: stem doubles as ruled column, foot flares like a stamped serif -->
  <g>
    <!-- stem -->
    <rect x="205" y="132" width="46" height="216" rx="6" fill="url(#gold)"/>
    <!-- top serif -->
    <rect x="187" y="132" width="82" height="26" rx="6" fill="url(#gold)"/>
    <!-- foot -->
    <rect x="205" y="298" width="150" height="50" rx="6" fill="url(#gold)"/>
    <!-- foot serif end -->
    <rect x="326" y="292" width="30" height="62" rx="6" fill="url(#gold)"/>

    <!-- ledger tick marks engraved into the stem, like column rules -->
    <g stroke="#7B5F17" stroke-width="4" opacity="0.65">
      <line x1="215" y1="168" x2="241" y2="168"/>
      <line x1="215" y1="208" x2="241" y2="208"/>
      <line x1="215" y1="248" x2="241" y2="248"/>
    </g>
  </g>

  <!-- red ledger rule -->
  <rect x="150" y="378" width="212" height="10" rx="5" fill="#B4472E"/>
  <rect x="150" y="396" width="212" height="4" rx="2" fill="#C7A233" opacity="0.8"/>

  <!-- embossed frame -->
  <rect x="34" y="34" width="444" height="444" rx="86" fill="none" stroke="#C7A233" stroke-opacity="0.25" stroke-width="3"/>
</svg>
